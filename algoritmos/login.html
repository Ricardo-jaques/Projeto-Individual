<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo Jaques - Cadastro / Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        
        <!-- Topo da página -->
        <div class="cima">
            <div class="logo">
                <img src="imagens/logo.svg" alt="Logo">
            </div>
            <div class="seçoes">
               <a href="index.html" class="quadrados">Home</a>
               <a href="sobre.html" class="quadrados">Sobre</a>
               <a href="entrar.html" class="quadrados ativo">Cadastro / Login</a>
               <a href="dashboard.html" class="quadrados">Dashboard</a>
            </div>
        </div>

        <div class="linha"></div>

      
        <div class="container-auth">
            
        
            <div class="card-auth-esquerda">
                <div class="kanji-icone">旅</div>
                <h1 class="rosa" style="font-size: 1.5rem; text-align: center; margin: 0;">Encontre quem gosta do mesmo que você</h1>
                <p class="roxo" style="text-align: center; font-size: 0.9rem; margin: 0;">Cadastre os animes que você assiste e descubra quem mais gosta deles.</p>
            </div>

            
            <div class="card-auth-direita">
              
                <div class="abas-auth">
                  <a href="login.html" class="aba-btn" style="text-decoration: none; text-align: center;">Entrar</a>
                    <a href="cadastro.html" class="aba-btn aba-ativa" style="text-decoration: none; text-align: center;">Cadastrar</a>
                </div>

                <!-- Formulário -->
                <form class="form-auth">
                    <label class="label-auth">E-MAIL</label>
                    <input type="email" placeholder="voce@email.com" class="input-auth" required>

                    <label class="label-auth">SENHA</label>
                    <input type="password" placeholder="********" class="input-auth" required>

                    <button type="submit" class="btn-submit">Entrar</button>
                </form>

            
            </div>

        </div>

    </div>
</body>
</html>
