<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo Jaques - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        
        <div class="cima">
            <div class="logo">
                <img src="imagens/logo.svg" alt="Logo">
            </div>
            <div class="seçoes">
               <a href="index.html" class="quadrados">Home</a>
               <a href="sobre.html" class="quadrados">Sobre</a>
               <a href="index.html" class="quadrados">Sair</a>
               <a href="dashboard.html" class="quadrados ativo">Dashboard</a>
            </div>
        </div>

        <div class="linha"></div>

      
        <div class="meio-cadLog">
            <div class="texto">
                <h1 class="branco">BEM-VINDO DE VOLTA,</h1>
                <h1 class="rosa">RICARDO!</h1>
                <p class="roxo">Continue sua jornada: adicione os animes que você assistiu e acompanhe seus dados.</p>
                
                <div class="botoes-cadLog">
                    <a href="#" class="btn-adicionar">+ Adicionar anime</a>
                    <a href="#" class="btn-painel">Ver meu painel</a>
                </div>
            </div>
           
            
            <h1 class="direita">おかえり</h1>
        </div>

        <br>
        <div class="linha-baixo"></div>

      
        <div class="baixo-kpis">
            <div class="kpi-card">
                <span class="kpi-titulo">SEU NÍVEL</span>
                <h2 class="azul">Novato</h2>
            </div>

            <div class="kpi-card">
                <span class="kpi-titulo">ANIMES QUE VOCÊ ASSISTE</span>
                <h2 class="azul">60</h2>
            </div>

            <div class="kpi-card">
                <span class="kpi-titulo">TEMPO TOTAL ASSISTIDO</span>
                <h2 class="azul">240h</h2>
            </div>
        </div>

    </div>
</body>
</html>
