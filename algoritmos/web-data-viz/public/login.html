<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo Jaques - Cadastro / Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        
        <!-- Topo da página -->
        <div class="cima">
            <div class="logo">
                <img src="assets/logo.svg" alt="Logo">
            </div>
            <div class="seçoes">
               <a href="index.html" class="quadrados">HOME</a>
               <a href="sobre.html" class="quadrados">SOBRE</a>
               <a href="entrar.html" class="quadrados ativo">CADASTRO/LOGIN</a>
              
            </div>
        </div>

        <div class="linha"></div>

      
        <div class="container-auth">
            
        
            <div class="card-auth-esquerda">
                <div class="kanji-icone">旅</div>
                <h1 class="rosa" style="font-size: 1.5rem; text-align: center; margin: 0;">Venha Ver os Animes que voce gosta e o progresso deles</h1>
                <p class="roxo" style="text-align: center; font-size: 0.9rem; margin: 0;">Cadastre os animes que você assiste</p>
            </div>

            
            <div class="card-auth-direita">
              
                <div class="abas-auth">
                  <a href="login.html" class="aba-btn aba-ativa" style="text-decoration: none; text-align: center;">Entrar</a>
                    <a href="cadastro.html" class="aba-btn " style="text-decoration: none; text-align: center;">Cadastrar</a>
                </div>

                
                <div class="form-auth">
                    <label class="label-auth">E-MAIL</label>
                    <input type="email" placeholder="voce@email.com" class="input-auth" id="inp_Email">
                    <span id="EmailErro" class="mensagem-erro"></span>

                    <label class="label-auth">SENHA</label>
                    <input type="password" placeholder="********" class="input-auth" id="inp_Senha">
                    <span id="senhaErro" class="mensagem-erro"></span>

                    <button onclick="entrar()" class="btn-submit">Entrar</button>
                    <span id="erroTotal" class="mensagem-erro-total"></span>
                </div>

            
            </div>

        </div>

    </div>
</body>
</html>

<script>
     function entrar() {

        var emailVar = inp_Email.value;
        var senhaVar = inp_Senha.value;

        if (emailVar == "" || senhaVar == "") {
            erroTotal.innerHTML = "Insira Algum Valor Nos Campos";
        }else{

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "homeLog.html";
                    }, 1000);

                });

            } else {

                erroTotal.innerHTML=`Houve um erro ao tentar realizar o login!`;

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
}

</script>
